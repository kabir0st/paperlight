<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gentle Page PDF</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <img src="images/logo.png" alt="Logo">
        <h1>Gentle Page PDF</h1>
      </div>
    </div>

    <div class="control-group">
      <label for="enable-toggle" class="label-text">Enable</label>
      <label class="switch">
        <input type="checkbox" id="enable-toggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="control-group" style="flex-direction: column; align-items: flex-start; gap: 8px;">
      <label class="label-text">Theme</label>
      <div class="button-group">
        <button class="group-btn" id="light-btn" data-theme="light">Light</button>
        <button class="group-btn" id="dark-btn" data-theme="dark">Dark</button>
      </div>
    </div>

    <div class="footer">
      <a href="https://kabir0st.info/" target="_blank" class="portfolio-button">
        <span class="portfolio-emoji">🚀</span>
        <span class="portfolio-text">Check out my work</span>
      </a>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
